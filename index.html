<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Synapse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:UB;src:url(syn_ub.woff2) format("woff2");font-weight:400 900;font-display:swap}
@font-face{font-family:JB;src:url(syn_jb.woff2) format("woff2");font-display:swap}
:root{--bg:#06070d;--c1:#0d1020;--tx:#f2f6ff;--mut:#9aa3c0;--dim:#5d6585;
--cy:#19f0ff;--mg:#ff2bd6;--vi:#8c5bff;--gd:#ffcf5a;--gd2:#ffe9a8;--ok:#3dffa8;--bad:#ff5a7a;
--r:20px;--e:cubic-bezier(.2,.9,.25,1);--vh:100vh;--navh:66px;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
body{font:15px/1.5 -apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#bgx{position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(60% 40% at 10% 0%,rgba(25,240,255,.10),transparent 70%),radial-gradient(50% 40% at 100% 30%,rgba(255,43,214,.08),transparent 70%),
linear-gradient(rgba(25,240,255,.05) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(25,240,255,.05) 1px,transparent 1px) 0 0/28px 28px,var(--bg)}
#app{position:relative;z-index:1;height:var(--vh);display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.logo{display:flex;align-items:center;gap:8px;font:800 17px UB,sans-serif;letter-spacing:.02em}
.logo svg{width:34px;height:20px}
.tag{font:11px JB,monospace;color:var(--mg);letter-spacing:.12em;margin-left:auto}
.plan{font:700 10px JB,monospace;letter-spacing:.1em;padding:4px 9px;border-radius:99px;border:1.5px solid var(--mg);color:var(--mg)}
.plan.pr{border-color:var(--gd);color:#1a1200;background:linear-gradient(135deg,var(--gd2),var(--gd))}
#main{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(var(--navh) + var(--sb) + 18px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scr::-webkit-scrollbar{width:0}
.in{animation:in .32s var(--e) both}.in.bk{animation-name:inb}
@keyframes in{from{opacity:0;transform:translate3d(14px,0,0)}}@keyframes inb{from{opacity:0;transform:translate3d(-14px,0,0)}}
@keyframes up{from{opacity:0;transform:translate3d(0,10px,0)}}
h1,.h{font-family:UB,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
h1{font-size:30px;margin:6px 0 4px}
.lab{font:11px JB,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mg)}
.lab.cy{color:var(--cy)}.lab.gd{color:var(--gd)}.lab.mu{color:var(--dim)}
.mut{color:var(--mut)}.sm{font-size:13px}
.box{position:relative;border:2px solid var(--cy);border-radius:var(--r);background:linear-gradient(180deg,rgba(25,240,255,.06),rgba(13,16,32,.9) 60%);padding:16px;margin-top:12px;box-shadow:0 0 0 1px rgba(25,240,255,.08),0 0 24px -12px var(--cy)}
.box.mg{border-color:var(--mg);background:linear-gradient(180deg,rgba(255,43,214,.07),rgba(13,16,32,.9) 60%);box-shadow:0 0 24px -12px var(--mg)}
.box.vi{border-color:var(--vi);background:linear-gradient(180deg,rgba(140,91,255,.08),rgba(13,16,32,.9) 60%);box-shadow:0 0 24px -12px var(--vi)}
.box.gd{border-color:var(--gd);background:linear-gradient(160deg,rgba(255,207,90,.14),rgba(20,16,8,.92) 55%);box-shadow:0 0 28px -12px var(--gd)}
.box.dim{border:1.5px solid rgba(255,255,255,.1);background:rgba(13,16,32,.85);box-shadow:none}
.row{display:flex;align-items:center;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font:900 54px/1 UB,sans-serif;letter-spacing:-.02em}
.mid{font:800 22px/1.1 UB,sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;padding:0 18px;border-radius:16px;font:800 14px UB,sans-serif;text-transform:uppercase;letter-spacing:.03em;color:#04121a;background:linear-gradient(135deg,#7ff8ff,var(--cy) 45%,#00b8ff);box-shadow:0 8px 24px -10px var(--cy),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s}
.btn:active,.li:active,.chip:active,.tile:active,.pl:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn.gd{color:#1a1200;background:linear-gradient(135deg,var(--gd2),var(--gd) 50%,#ffab2e);box-shadow:0 8px 26px -10px var(--gd),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.ol{color:var(--tx);background:rgba(13,16,32,.8);border:2px solid var(--mg);box-shadow:0 0 18px -10px var(--mg)}
.g2 .btn{font-size:12px;padding:0 10px}.btn.ol.cy{border-color:var(--cy);box-shadow:0 0 18px -10px var(--cy)}
.btn svg,.li svg,.chip svg,#nav svg,.ib svg,.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;background:rgba(13,16,32,.85);border:1.5px solid rgba(255,255,255,.09);text-align:left;margin-top:8px;transition:transform .15s}
.li .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1.5px solid rgba(25,240,255,.4);color:var(--cy);flex:none}
.li b{display:block;font-weight:700;font-size:15px}.li span.s{display:block;font-size:12px;color:var(--mut)}
.li .ar{margin-left:auto;color:var(--dim);font-size:20px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:99px;border:1.5px solid rgba(25,240,255,.35);background:rgba(13,16,32,.92);font:600 13px/1 system-ui,sans-serif;white-space:nowrap;transition:transform .15s}
.chip.on{border-color:var(--cy);color:var(--cy)}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--cy),var(--mg));transform-origin:left;transform:scaleX(var(--p,0));transition:transform .9s var(--e)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font:12px JB,monospace;letter-spacing:.08em;text-transform:uppercase;padding:8px 0}
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sb));z-index:20;height:var(--navh);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:22px;background:#0a0c17;border:1.5px solid rgba(25,240,255,.28);box-shadow:0 10px 30px -8px #000;transition:transform .3s var(--e),opacity .3s}
#nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:16px;color:var(--dim);font:10px JB,monospace;letter-spacing:.08em;text-transform:uppercase;transition:color .2s,background .2s}
#nav button.on{color:var(--cy);background:rgba(25,240,255,.09)}
body.nonav #nav{transform:translate3d(0,140%,0);opacity:0;pointer-events:none}
.hero{display:flex;align-items:center;gap:16px}
.flame{width:72px;height:84px;flex:none}
.days{display:flex;gap:6px;margin-top:14px}
.days i{flex:1;height:30px;border-radius:9px;border:1.5px solid rgba(255,255,255,.1);display:grid;place-items:center;font:10px JB,monospace;font-style:normal;color:var(--dim)}
.days i.on{border-color:var(--mg);color:#fff;background:rgba(255,43,214,.14)}
.days i.td{border-color:var(--cy);color:var(--cy)}
.qod{font:700 18px/1.3 system-ui,sans-serif;margin:8px 0 14px}
.stat{padding:12px;border-radius:16px;border:1.5px solid rgba(255,255,255,.1);background:rgba(13,16,32,.85)}
.stat b{display:block;font:800 18px UB,sans-serif;margin-top:4px}
.chat{position:absolute;inset:0;display:flex;flex-direction:column}
.ch{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1.5px solid rgba(25,240,255,.18);background:#080a14}
.ch .t{font:800 16px UB,sans-serif;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font:700 12px JB,monospace;border:1.5px solid rgba(255,207,90,.45);color:var(--gd)}
.net{display:inline-flex;align-items:center;gap:6px;font:11px JB,monospace;color:var(--mut)}
.net i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.net.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.net.wait i{background:var(--gd)}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.12);flex:none}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
#log::-webkit-scrollbar{width:0}
.m{max-width:88%;animation:up .3s var(--e) both}
.m.me{align-self:flex-end;padding:10px 15px;border-radius:20px 20px 6px 20px;border:2px solid var(--mg);background:rgba(255,43,214,.12);box-shadow:0 0 16px -8px var(--mg);font-size:15px;white-space:pre-wrap;word-break:break-word}
.m.me img{display:block;max-width:220px;border-radius:12px;margin-bottom:6px}
.m.ai{align-self:stretch;max-width:100%;padding:4px 4px 4px 14px;border-left:3px solid var(--cy);background:linear-gradient(90deg,rgba(25,240,255,.07),transparent 85%);border-radius:0 14px 14px 0;font-size:15.5px;line-height:1.6;word-break:break-word}
.m.ai.note{border-left-color:var(--gd);background:linear-gradient(90deg,rgba(255,207,90,.08),transparent 85%);color:#ffe7b0;font-size:14px}
.m.ai p{margin:6px 0}.m.ai b{color:#fff}.m.ai ul,.m.ai ol{margin:6px 0 6px 20px}.m.ai li{margin:3px 0}
.m.ai code{font:13px JB,monospace;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:6px}
.m.ai pre{font:13px/1.5 JB,monospace;background:#05060c;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;overflow-x:auto;margin:8px 0}
.m.ai .k{font:10px JB,monospace;letter-spacing:.12em;color:var(--cy);text-transform:uppercase;margin-top:10px}
.m.ai .k.mg{color:var(--mg)}.m.ai .k.gd{color:var(--gd)}
.tm{font:10px JB,monospace;color:var(--dim);margin-top:3px;text-align:right}
.typing{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--cy);animation:bl 1s infinite both}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25;transform:translateY(-3px)}}
.empty{margin:auto;text-align:center;padding:20px}
.empty .h{font-size:20px}
.qs{display:flex;gap:8px;overflow-x:auto;padding:0 14px 8px;flex:none}.qs::-webkit-scrollbar{display:none}
.comp{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 12px calc(10px + var(--sb));background:#080a14;border-top:1.5px solid rgba(25,240,255,.14);transition:padding .3s var(--e)}
body:not(.nonav) .comp{padding-bottom:calc(var(--navh) + var(--sb) + 18px)}
.comp textarea{flex:1;min-height:44px;max-height:140px;resize:none;border:2px solid rgba(25,240,255,.3);border-radius:22px;background:#0b0e1c;padding:11px 16px;outline:0;font-size:16px;line-height:1.3;transition:border-color .2s}
.comp textarea:focus{border-color:var(--cy)}
.comp .ib{width:44px;height:44px;border-radius:50%}
#send{background:rgba(25,240,255,.1);border-color:rgba(25,240,255,.45);color:var(--cy);transition:background .2s}
#send.go{background:var(--cy);color:#04121a;border-color:var(--cy)}
#send.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.menu{position:absolute;right:12px;top:56px;z-index:30;min-width:230px;padding:6px;border-radius:16px;background:#0c0f1e;border:1.5px solid rgba(25,240,255,.3);box-shadow:0 20px 40px -10px #000;animation:up .2s var(--e)}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-size:14px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;border:2px solid var(--vi);background:rgba(13,16,32,.88);text-align:left;min-height:118px;transition:transform .15s}
.tile.cy{border-color:var(--cy)}.tile.mg{border-color:var(--mg)}
.tile .em{font-size:28px;line-height:1}
.tile b{font:800 14px UB,sans-serif;text-transform:uppercase}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.ac{padding:12px 6px 10px;border-radius:16px;text-align:center;border:1.5px solid rgba(255,255,255,.08);background:#0b0d18;contain:content}
.ac.on{border-color:var(--rc,var(--cy))}
.ac i{display:block;font-style:normal;font-size:28px;line-height:1.2;opacity:.25;filter:grayscale(1)}
.ac.on i{opacity:1;filter:none}
.ac b{display:block;font-size:12px;margin-top:4px}.ac:not(.on) b{color:var(--dim)}
.ac em{display:block;font:9px JB,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--rc,var(--dim));font-style:normal;margin-top:2px}
.ac .bar{height:4px;margin-top:6px}
.ac .d{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.2}
.wheel{width:220px;height:220px;margin:16px auto 6px;position:relative}
.wheel svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.15,.9,.2,1)}
.wheel:after{content:"";position:absolute;left:50%;top:-6px;margin-left:-9px;border:9px solid transparent;border-top:16px solid var(--gd)}
.av{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font:900 26px UB,sans-serif;color:#04121a;background:linear-gradient(135deg,var(--cy),var(--vi));flex:none}
.wk{display:flex;align-items:flex-end;gap:6px;height:84px;margin-top:12px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wk s{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--cy),rgba(25,240,255,.25));min-height:4px;transform-origin:bottom;animation:gr .7s var(--e) both}
.wk s.z{background:rgba(255,255,255,.08)}
.wk span{font:9px JB,monospace;color:var(--dim)}
@keyframes gr{from{transform:scaleY(0)}}
.sw{margin-left:auto;width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;transition:background .2s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s var(--e)}
.sw.on{background:var(--cy)}.sw.on:after{transform:translateX(18px)}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.12);font-size:13px}
.seg button.on{border-color:var(--cy);color:var(--cy)}
.plans{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pl{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:2px solid rgba(255,207,90,.3);background:rgba(20,16,8,.8);text-align:left;width:100%;transition:transform .15s}
.pl.sel{border-color:var(--gd);box-shadow:0 0 22px -10px var(--gd)}
.pl b{font:800 15px UB,sans-serif;text-transform:uppercase}.pl .p{margin-left:auto;font:800 18px UB,sans-serif;color:var(--gd);white-space:nowrap}
.pl .rd{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,207,90,.5);flex:none}
.pl.sel .rd{border:6px solid var(--gd)}
#ov{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,4,8,.92)}
#ov.on{display:flex;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
#ov .card{width:min(380px,100%);text-align:center}
#ov img{max-width:100%;max-height:60vh;border-radius:18px;border:2px solid var(--cy)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));z-index:80;transform:translate3d(-50%,-20px,0);opacity:0;padding:10px 16px;border-radius:14px;background:#0c0f1e;border:1.5px solid var(--cy);font-size:14px;transition:transform .3s var(--e),opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translate3d(-50%,0,0);opacity:1}
.forge{width:200px;height:126px;margin:10px auto;border-radius:18px;border:2px solid var(--gd);background:linear-gradient(135deg,#2a1d05,#0f0b03);display:grid;place-items:center;font:900 22px UB,sans-serif;color:var(--gd);box-shadow:0 0 40px -10px var(--gd);animation:fg 1.4s var(--e) both}
@keyframes fg{0%{transform:scale(.4) rotate(-8deg);opacity:0}60%{transform:scale(1.06)}100%{transform:none;opacity:1}}
html.gold #nav{border-color:rgba(255,207,90,.35)}
html.min *,html.min *:before,html.min *:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
@media (max-width:370px){h1{font-size:25px}.big{font-size:44px}.scr{padding-left:12px;padding-right:12px}.mid{font-size:19px}}

html.light{--bg:#f4f6ff;--c1:#ffffff;--tx:#0d1020;--mut:#4a5275;--dim:#8a91ad;--cy:#0098b8;--mg:#d0119f;--vi:#6a3df0;--gd:#b07a00}
html.light body,html.light #app{background:var(--bg);color:var(--tx)}
html.light #bgx{opacity:.25}
.skel{display:block;height:10px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,rgba(25,240,255,.08),rgba(255,43,214,.22),rgba(25,240,255,.08));background-size:200% 100%;animation:sk 1.2s linear infinite}
.skel.w2{width:72%}.skel.w3{width:46%}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
pre{position:relative}pre .kw{color:var(--mg)}pre .st{color:var(--ok)}pre .cm{color:var(--dim);font-style:italic}pre .nu{color:var(--gd)}
.mx{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;margin:0 2px}.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.offl{text-align:center;padding:28px 18px}.offl .z{font-size:46px;line-height:1}
.sv{font-size:12px;color:var(--cy);background:none;border:1px solid rgba(25,240,255,.35);border-radius:10px;padding:3px 8px;margin-top:8px}
</style>
</head>
<body>
<div id="bgx"></div>
<div id="app">
 <header id="top"><div class="logo"><svg viewBox="0 0 34 20"><ellipse cx="17" cy="10" rx="15.5" ry="8.5" fill="none" stroke="#19f0ff" stroke-width="2.2"/><circle cx="17" cy="10" r="5.2" fill="#ff2bd6"/><circle cx="17" cy="10" r="2.2" fill="#06070d"/></svg>SYNAPSE</div><span class="tag">AI CORE</span><span class="plan" id="plan">FREE</span></header>
 <main id="main"></main>
</div>
<nav id="nav">
 <button data-tab="chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Чат</button>
 <button data-tab="prog"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Прогресс</button>
 <button data-tab="ref"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c.8-4 3.5-6 7-6s6.2 2 7 6M16 4a4 4 0 0 1 0 8M22 21c-.5-3-2-5-4-5.6"/></svg>Друзья</button>
 <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Профиль</button>
</nav>
<div id="ov"></div>
<div id="toast"></div>
<script>
(function(){
"use strict";
var tg=window.Telegram&&window.Telegram.WebApp,inside=!!(tg&&tg.initData);
