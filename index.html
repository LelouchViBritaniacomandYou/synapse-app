:root{color-scheme:dark;--k:#00f0ff;--k2:#ff2bd6;--g:#ffc43c;--bg:#07070a;--c1:#0f0f14;--c2:#15151c;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#f2f3f7;--mut:#8a8d9c;--dim:#5d606e;
 --st:var(--tg-safe-area-inset-top,0px);--sct:var(--tg-content-safe-area-inset-top,0px);--sb:var(--tg-safe-area-inset-bottom,0px);--e:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;justify-content:center;
 background:radial-gradient(520px 320px at 50% -60px,rgba(0,240,255,.07),transparent 70%),radial-gradient(420px 300px at 110% 105%,rgba(255,43,214,.05),transparent 70%),var(--bg)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.app{position:relative;width:min(480px,100%);height:100dvh;display:flex;flex-direction:column;padding:calc(8px + max(env(safe-area-inset-top),calc(var(--st) + var(--sct)))) 18px 0}
.H{font-family:UB,Impact,sans-serif;letter-spacing:-.01em}.M{font-family:UM,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;font-family:UB,sans-serif;font-size:15px;letter-spacing:.12em}
.core{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff 0 14%,var(--k) 38%,rgba(0,240,255,0) 72%);box-shadow:0 0 14px rgba(0,240,255,.55);animation:pulse 3.2s var(--e) infinite}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 22px rgba(0,240,255,.75)}}
.plan{font:600 11px UM,sans-serif;letter-spacing:.08em;padding:6px 11px;border-radius:999px;border:1px solid var(--ln2);color:var(--mut)}
.plan.pr{color:#1a1206;border:0;background:linear-gradient(110deg,#b8892c,#ffe7a3 40%,#c99a3a 60%,#fff1c4);background-size:220% 100%;animation:metal 4s linear infinite}
@keyframes metal{to{background-position:-220% 0}}
main{flex:1;position:relative;min-height:0}
.scr{position:absolute;inset:0;overflow:auto;padding:6px 0 28px;animation:in .38s var(--e);scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}.scr.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.t1{font-family:UB,sans-serif;font-size:28px;line-height:1.1;margin:6px 0 6px;letter-spacing:-.01em}
.t1 em{font-style:normal;color:var(--k)}
.sub{color:var(--mut);font-size:14px;margin:0 0 22px}
.lbl{font:600 11px UM,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;padding:6px 0;min-height:40px;margin-bottom:2px}
.card{position:relative;background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--ln);border-radius:22px;padding:18px}
/* фирменная рамка бота, но тонко */
.frame{border-color:rgba(0,240,255,.35);box-shadow:0 0 0 1px rgba(0,240,255,.06),0 10px 40px -12px rgba(0,240,255,.25)}
.frame::after{content:"";position:absolute;inset:-6px;pointer-events:none;--b:rgba(0,240,255,.9);
 background:linear-gradient(var(--b),var(--b)) 0 0/12px 1.5px,linear-gradient(var(--b),var(--b)) 0 0/1.5px 12px,linear-gradient(var(--b),var(--b)) 100% 0/12px 1.5px,linear-gradient(var(--b),var(--b)) 100% 0/1.5px 12px,
 linear-gradient(var(--b),var(--b)) 0 100%/12px 1.5px,linear-gradient(var(--b),var(--b)) 0 100%/1.5px 12px,linear-gradient(var(--b),var(--b)) 100% 100%/12px 1.5px,linear-gradient(var(--b),var(--b)) 100% 100%/1.5px 12px;background-repeat:no-repeat}
.askbox{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:0 16px;border-radius:16px;border:1px solid var(--ln2);background:rgba(0,0,0,.35);color:var(--mut);font:inherit;font-size:15px;text-align:left}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;margin-top:12px;padding:0 18px;border:0;border-radius:16px;font:14px UB,sans-serif;letter-spacing:.02em;color:#041014;background:linear-gradient(100deg,#00f0ff,#7af7ff);box-shadow:0 8px 28px -8px rgba(0,240,255,.6);transition:transform .15s var(--e),box-shadow .2s}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln2);box-shadow:none}
.btn.gold{color:#1a1206;background:linear-gradient(110deg,#c99a3a,#ffe7a3 45%,#d9a84a);box-shadow:0 8px 28px -8px rgba(255,196,60,.55)}
.btn:disabled{opacity:.4}button{cursor:pointer}button:active{transform:scale(.97)}
.lim{display:flex;align-items:center;gap:16px}
.lim .num{font:34px/1 UB,sans-serif}.lim .num small{font:14px UM,sans-serif;color:var(--mut);margin-left:4px}
.lim .meta{flex:1;min-width:0}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--k),#7af7ff);transition:width 1s var(--e)}
.bar.low i{background:linear-gradient(90deg,var(--k2),#ff7ae5)}
.mut{color:var(--mut);font-size:13px;margin:0}.dim{color:var(--dim)}
.subj{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sj{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;border-radius:16px;border:1px solid var(--ln);background:var(--c1);color:var(--tx);font:12px UM,sans-serif;transition:border-color .2s,transform .15s var(--e)}
.sj i{font-style:normal;font-size:22px}.sj:active{border-color:rgba(0,240,255,.5)}
.list{border:1px solid var(--ln);border-radius:20px;background:var(--c1);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);font:inherit;text-align:left}
.li:last-child{border-bottom:0}.li .ic{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--ln);font-size:17px}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .tx span{display:block;color:var(--mut);font-size:12px}
.li .ar{color:var(--dim);font-size:18px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0 calc(10px + max(env(safe-area-inset-bottom),var(--sb)));border-top:1px solid var(--ln)}
