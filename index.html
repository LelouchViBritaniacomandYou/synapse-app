:root{color-scheme:dark;--k:#00f0ff;--k2:#ff2bd6;--g:#ffc43c;--bg:#07070a;--c1:#0f0f14;--c2:#15151c;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#f2f3f7;--mut:#8a8d9c;--dim:#5d606e;
 --st:var(--tg-safe-area-inset-top,0px);--sct:var(--tg-content-safe-area-inset-top,0px);--sb:var(--tg-safe-area-inset-bottom,0px);--e:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;justify-content:center;
 background:radial-gradient(520px 320px at 50% -60px,rgba(0,240,255,.07),transparent 70%),radial-gradient(420px 300px at 110% 105%,rgba(255,43,214,.05),transparent 70%),var(--bg)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.app{position:relative;width:min(480px,100%);height:100dvh;display:flex;flex-direction:column;padding:calc(8px + max(env(safe-area-inset-top),calc(var(--st) + var(--sct)))) 18px 0}
.H{font-family:UB,Impact,sans-serif;letter-spacing:-.01em}.M{font-family:UM,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:10px;font-family:UB,sans-serif;font-size:15px;letter-spacing:.12em}
.core{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff 0 14%,var(--k) 38%,rgba(0,240,255,0) 72%);box-shadow:0 0 14px rgba(0,240,255,.55);animation:pulse 3.2s var(--e) infinite}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 22px rgba(0,240,255,.75)}}
.plan{font:600 11px UM,sans-serif;letter-spacing:.08em;padding:6px 11px;border-radius:999px;border:1px solid var(--ln2);color:var(--mut)}
.plan.pr{color:#1a1206;border:0;background:linear-gradient(110deg,#b8892c,#ffe7a3 40%,#c99a3a 60%,#fff1c4);background-size:220% 100%;animation:metal 4s linear infinite}
@keyframes metal{to{background-position:-220% 0}}
main{flex:1;position:relative;min-height:0}
.scr{position:absolute;inset:0;overflow:auto;padding:6px 0 28px;animation:in .38s var(--e);scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}.scr.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.t1{font-family:UB,sans-serif;font-size:28px;line-height:1.1;margin:6px 0 6px;letter-spacing:-.01em}
.t1 em{font-style:normal;color:var(--k)}
.sub{color:var(--mut);font-size:14px;margin:0 0 22px}
.lbl{font:600 11px UM,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;padding:6px 0;min-height:40px;margin-bottom:2px}
.card{position:relative;background:linear-gradient(180deg,var(--c2),var(--c1));border:1px solid var(--ln);border-radius:22px;padding:18px}
/* фирменная рамка бота, но тонко */
.frame{border-color:rgba(0,240,255,.35);box-shadow:0 0 0 1px rgba(0,240,255,.06),0 10px 40px -12px rgba(0,240,255,.25)}
.frame::after{content:"";position:absolute;inset:-6px;pointer-events:none;--b:rgba(0,240,255,.9);
 background:linear-gradient(var(--b),var(--b)) 0 0/12px 1.5px,linear-gradient(var(--b),var(--b)) 0 0/1.5px 12px,linear-gradient(var(--b),var(--b)) 100% 0/12px 1.5px,linear-gradient(var(--b),var(--b)) 100% 0/1.5px 12px,
 linear-gradient(var(--b),var(--b)) 0 100%/12px 1.5px,linear-gradient(var(--b),var(--b)) 0 100%/1.5px 12px,linear-gradient(var(--b),var(--b)) 100% 100%/12px 1.5px,linear-gradient(var(--b),var(--b)) 100% 100%/1.5px 12px;background-repeat:no-repeat}
.askbox{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:0 16px;border-radius:16px;border:1px solid var(--ln2);background:rgba(0,0,0,.35);color:var(--mut);font:inherit;font-size:15px;text-align:left}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;margin-top:12px;padding:0 18px;border:0;border-radius:16px;font:14px UB,sans-serif;letter-spacing:.02em;color:#041014;background:linear-gradient(100deg,#00f0ff,#7af7ff);box-shadow:0 8px 28px -8px rgba(0,240,255,.6);transition:transform .15s var(--e),box-shadow .2s}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln2);box-shadow:none}
.btn.gold{color:#1a1206;background:linear-gradient(110deg,#c99a3a,#ffe7a3 45%,#d9a84a);box-shadow:0 8px 28px -8px rgba(255,196,60,.55)}
.btn:disabled{opacity:.4}button{cursor:pointer}button:active{transform:scale(.97)}
.lim{display:flex;align-items:center;gap:16px}
.lim .num{font:34px/1 UB,sans-serif}.lim .num small{font:14px UM,sans-serif;color:var(--mut);margin-left:4px}
.lim .meta{flex:1;min-width:0}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--k),#7af7ff);transition:width 1s var(--e)}
.bar.low i{background:linear-gradient(90deg,var(--k2),#ff7ae5)}
.mut{color:var(--mut);font-size:13px;margin:0}.dim{color:var(--dim)}
.subj{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sj{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;border-radius:16px;border:1px solid var(--ln);background:var(--c1);color:var(--tx);font:12px UM,sans-serif;transition:border-color .2s,transform .15s var(--e)}
.sj i{font-style:normal;font-size:22px}.sj:active{border-color:rgba(0,240,255,.5)}
.list{border:1px solid var(--ln);border-radius:20px;background:var(--c1);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:12px 16px;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);font:inherit;text-align:left}
.li:last-child{border-bottom:0}.li .ic{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--ln);font-size:17px}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .tx span{display:block;color:var(--mut);font-size:12px}
.li .ar{color:var(--dim);font-size:18px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0 calc(10px + max(env(safe-area-inset-bottom),var(--sb)));border-top:1px solid var(--ln)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;border:0;background:none;color:var(--dim);font:600 11px UM,sans-serif;transition:color .2s}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--tx)}.tabs button.on svg{stroke:var(--k);filter:drop-shadow(0 0 6px rgba(0,240,255,.6))}
.chat{display:flex;flex-direction:column;height:100%}
.log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 8px}
.bub{max-width:86%;padding:11px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;animation:pop .3s var(--e);font-size:15px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.me{margin-left:auto;background:#0d2a30;border:1px solid rgba(0,240,255,.25);border-bottom-right-radius:6px}
.bot{margin-right:auto;background:var(--c2);border:1px solid var(--ln);border-bottom-left-radius:6px}
.plate{margin:6px 0;padding:10px;border-radius:12px;background:rgba(0,0,0,.3)}.plate b{display:block;font:10px UM,sans-serif;letter-spacing:.14em;color:var(--k);margin-bottom:3px}
.comp{display:flex;gap:8px;align-items:flex-end;padding-top:8px}
textarea,input[type=search]{width:100%;border-radius:16px;border:1px solid var(--ln2);background:var(--c1);color:var(--tx);font:inherit;font-size:16px;padding:15px 16px;outline:none;transition:border-color .2s}
textarea{resize:none;height:56px;max-height:140px}textarea:focus,input:focus{border-color:rgba(0,240,255,.55)}
.send{width:56px;height:56px;flex:none;border:0;border-radius:16px;background:var(--k);color:#041014;font-size:20px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ln2);background:none;color:var(--tx);font:12px UM,sans-serif}
.chip.on{border-color:var(--k);color:var(--k)}
.tool{display:flex;gap:8px;justify-content:flex-end;margin-bottom:4px}.tool button{min-height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--mut);font:12px inherit}
.empty{margin:auto 0;text-align:center;color:var(--mut);padding:30px 10px}.empty b{display:block;font:20px UB,sans-serif;color:var(--tx);margin-bottom:8px}
.days{display:flex;justify-content:space-between;margin:14px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--ln2);font-size:14px}
.dot.on{border-color:transparent;background:radial-gradient(circle at 50% 60%,rgba(255,140,60,.35),rgba(255,43,214,.15));box-shadow:inset 0 0 0 1px rgba(255,150,80,.6)}
.dot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--k)}
.prof{display:flex;align-items:center;gap:16px}
.name{font:24px/1.1 UB,sans-serif;word-break:break-word}
.tag{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:8px;border:1px solid var(--ln2);font:11px UM,sans-serif;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font:44px/1 UB,sans-serif}
.holo{position:relative;overflow:hidden;border-radius:24px;padding:26px 20px;text-align:center;border:1px solid transparent;
 background:linear-gradient(180deg,#14131a,#0c0b10) padding-box,linear-gradient(120deg,#6b5520,#ffe7a3,#9a7a33,#c9f6ff,#b98cff,#6b5520) border-box;background-size:100% 100%,300% 300%;animation:hb 8s linear infinite}
@keyframes hb{to{background-position:0 0,300% 0}}
.holo::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,rgba(200,240,255,.09) 50%,transparent 65%);background-size:250% 100%;animation:sweep 5s var(--e) infinite;pointer-events:none}
@keyframes sweep{0%{background-position:150% 0}60%,100%{background-position:-100% 0}}
.gold{background:linear-gradient(110deg,#c99a3a,#ffe7a3 45%,#d9a84a);-webkit-background-clip:text;background-clip:text;color:transparent}
.cmp{width:100%;border-collapse:collapse;font-size:14px}.cmp td{padding:13px 0;border-bottom:1px solid var(--ln)}.cmp tr:last-child td{border-bottom:0}
.cmp td:nth-child(2),.cmp td:nth-child(3){text-align:center;width:24%}.cmp td:nth-child(2){color:var(--mut)}.cmp td:nth-child(3){font-weight:700}
.cmp th{font:10px UM,sans-serif;letter-spacing:.12em;color:var(--dim);text-align:center;padding-bottom:4px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:128px;padding:18px 4px 14px;border-radius:18px;border:1px solid var(--ln2);background:var(--c1);color:var(--tx);font:inherit;transition:transform .15s var(--e)}
.pl.hit{border-color:rgba(255,215,130,.7);background:linear-gradient(180deg,#1b1810,#0f0e0b);box-shadow:0 10px 30px -10px rgba(255,196,60,.45)}
.pl small{color:var(--mut);font-size:11px}.pl b{font:22px UB,sans-serif;margin:2px 0}
.pl .sv{margin-top:4px;font:10px UM,sans-serif;color:var(--g)}
.pl .ht{position:absolute;top:-9px;left:50%;transform:translateX(-50%);padding:2px 8px;border-radius:6px;font:9px UB,sans-serif;letter-spacing:.06em;color:#1a1206;background:linear-gradient(110deg,#c99a3a,#ffe7a3)}
.lnk{display:block;margin:16px auto 0;min-height:40px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--ln2)}
.ring{position:relative;flex:none}.ring svg{transform:rotate(-90deg);display:block}.ring circle{fill:none}
.ring .tr{stroke:rgba(255,255,255,.06)}.ring .fg{stroke:var(--k);stroke-linecap:round;transition:stroke-dashoffset 1s var(--e)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg{display:flex;padding:4px;border-radius:14px;border:1px solid var(--ln);background:var(--c1)}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;color:var(--mut);font:12px UM,sans-serif;transition:.2s}
.seg button.on{background:var(--c2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--ln2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{padding:14px 16px;border-bottom:1px solid var(--ln)}.note:last-child{border-bottom:0}
.note b{display:block;font-weight:600;margin-bottom:3px;padding-right:34px}.note p{margin:0;font-size:13px;color:var(--mut);white-space:pre-wrap;word-break:break-word;max-height:6em;overflow:hidden}
.note{position:relative}.note .x{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;background:none;color:var(--dim);font-size:18px}
.fc{position:relative;height:240px;perspective:1000px;touch-action:pan-y}
.fc .in{position:absolute;inset:0;transition:transform .55s var(--e);transform-style:preserve-3d}.fc.flip .in{transform:rotateY(180deg)}
.fc .f{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:22px;font-size:19px;font-weight:600;white-space:pre-wrap;overflow:auto;border:1px solid rgba(0,240,255,.35);background:linear-gradient(180deg,var(--c2),var(--c1))}
.fc .bk{transform:rotateY(180deg);font-weight:400;font-size:16px;border-color:var(--ln2)}
.shareimg{display:block;width:100%;min-height:200px;border-radius:20px;border:1px solid var(--ln2)}
.link{font:12px ui-monospace,monospace;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--ln);word-break:break-all;color:var(--mut);margin-top:12px}
.nudge{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,215,130,.35);background:rgba(255,196,60,.05);font-size:13px}
.nudge button{flex:none;min-height:36px;padding:0 12px;border:0;border-radius:10px;font:11px UB,sans-serif;color:#1a1206;background:linear-gradient(110deg,#c99a3a,#ffe7a3)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(8px);background:rgba(20,20,26,.96);border:1px solid var(--ln2);border-radius:14px;padding:11px 16px;font-size:14px;opacity:0;transition:.25s var(--e);pointer-events:none;z-index:40;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
#onb{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:18px;background:rgba(4,4,6,.75);backdrop-filter:blur(8px);animation:fade .3s}
@keyframes fade{from{opacity:0}}
#onb .card{width:min(440px,100%);padding:26px 22px 14px;animation:in .4s var(--e)}
#onb .em{font-size:44px}#onb .t1{font-size:24px;margin-top:12px}
.pg{display:flex;gap:6px;margin:16px 0 0}.pg i{width:18px;height:3px;border-radius:3px;background:var(--ln2);transition:.3s}.pg i.on{background:var(--k);width:28px}
#depth{position:fixed;inset:-60px;z-index:0;pointer-events:none;overflow:hidden}
#depth i{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform;opacity:.55}
#depth .b1{width:420px;height:420px;left:-120px;top:-160px;background:radial-gradient(circle,rgba(0,240,255,.16),transparent 65%)}
#depth .b2{width:380px;height:380px;right:-160px;bottom:-60px;background:radial-gradient(circle,rgba(255,43,214,.11),transparent 65%)}
#depth .b3{width:300px;height:300px;left:30%;top:40%;background:radial-gradient(circle,rgba(120,90,255,.08),transparent 65%)}
.app{z-index:1}
.fire{--w:30px;--c1:#ff7a1a;--c2:#ffb347;--c3:#fff1c4;position:relative;display:inline-block;width:var(--w);height:calc(var(--w)*1.25);vertical-align:middle;filter:drop-shadow(0 0 calc(var(--w)*.25) var(--c1))}
.fire i{position:absolute;left:50%;bottom:0;border-radius:50% 0 50% 50%;transform:translateX(-50%) rotate(-45deg);animation:fk 1.1s ease-in-out infinite alternate}
.fire i:nth-child(1){width:var(--w);height:var(--w);background:radial-gradient(circle at 60% 40%,var(--c2),var(--c1) 70%)}
.fire i:nth-child(2){width:calc(var(--w)*.66);height:calc(var(--w)*.66);background:var(--c2);animation-duration:.8s;animation-delay:-.3s}
.fire i:nth-child(3){width:calc(var(--w)*.34);height:calc(var(--w)*.34);background:var(--c3);animation-duration:.6s}
@keyframes fk{0%{transform:translateX(-50%) rotate(-45deg) scale(1)}50%{transform:translateX(-52%) rotate(-41deg) scale(1.06,.95)}100%{transform:translateX(-48%) rotate(-48deg) scale(.96,1.05)}}
.fire.t0{--c1:#3a3d48;--c2:#4a4e5c;--c3:#6a6e7c;filter:none}.fire.t0 i{animation:none}
.fire.t1{--w:18px;--c1:#ffb020;--c2:#ffd15a;--c3:#fff}
.fire.t3{--w:40px}.fire.t4{--w:42px;--c1:#8c52ff;--c2:#d58cff;--c3:#fff}.fire.t5{--w:46px;--c1:#1a7bff;--c2:#5cf2ff;--c3:#e6ffff}
.fire.mini{--w:13px;filter:none}
.firebox{width:64px;display:flex;justify-content:center;margin-right:10px}
.streak.t4{border-color:rgba(140,82,255,.35)}.streak.t5{border-color:rgba(26,123,255,.4);box-shadow:0 10px 40px -14px rgba(26,123,255,.5)}
.risk{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(255,120,40,.07);border:1px solid rgba(255,140,60,.3);font-size:13px;color:#ffd2b0}
.risk2{border-color:rgba(255,140,60,.35)}
.dot.on{background:rgba(255,140,60,.08);box-shadow:inset 0 0 0 1px rgba(255,150,80,.45)}
.sw{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--e)}
.sw.on{background:var(--k)}.sw.on i{transform:translateX(18px)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;border:1px solid var(--ln);background:var(--c1);text-align:center;font-size:11px;color:var(--dim)}
.bdg i{font-style:normal;font-size:26px;filter:grayscale(1) brightness(.35)}
.bdg.on{color:var(--tx);border-color:rgba(255,215,130,.35);background:linear-gradient(180deg,#17150f,var(--c1))}.bdg.on i{filter:none}
.bdg.sec{border-color:rgba(200,150,255,.45)}
.bdg.q i{filter:none;width:30px;height:30px;line-height:30px;border-radius:50%;border:1px dashed var(--ln2);font:16px UB,sans-serif;color:var(--dim)}
#fxv{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(4,4,6,.82);backdrop-filter:blur(6px);animation:fade .25s}
#fxv video{width:min(78vw,360px);border-radius:24px;box-shadow:0 20px 60px -10px rgba(0,240,255,.35)}
#fxv.out{opacity:0;transition:opacity .25s}
@media (max-width:370px){.app{padding-left:14px;padding-right:14px}.t1{font-size:24px}.sj{min-height:70px;font-size:11px}.pl b{font-size:18px}.dot{width:28px;height:28px}.name{font-size:20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

:root{--k:#00f0ff;--k2:#ff2bd6;--vi:#8c52ff;--bg:#05060f;--c1:rgba(10,12,30,.82);--c2:rgba(16,18,44,.86);--ln:rgba(90,110,200,.18);--ln2:rgba(120,140,230,.3);--tx:#eef2ff;--mut:#9aa1cc;--dim:#646a99}
body{background:linear-gradient(180deg,#05060f,#0e0822) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
 background:linear-gradient(rgba(80,90,160,.09) 1px,transparent 1px) 0 0/27px 27px,linear-gradient(90deg,rgba(80,90,160,.09) 1px,transparent 1px) 0 0/27px 27px;
 -webkit-mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.5));mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.5))}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(60% 34% at 8% 4%,rgba(0,240,255,.16),transparent 70%),radial-gradient(55% 32% at 95% 100%,rgba(255,43,214,.16),transparent 70%)}
.app{z-index:1}
.MONO,.lbl,.tagai,.plate>b,.mono{font-family:JB,ui-monospace,monospace}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--k);text-transform:uppercase;font-weight:500}
.lbl::before{content:"// ";opacity:.7}
.t1{text-transform:uppercase;font-size:24px;letter-spacing:.01em;text-shadow:0 0 18px rgba(0,240,255,.25)}
.t1 em{color:var(--k);text-shadow:0 0 16px rgba(0,240,255,.7)}
.logo{font-size:16px;letter-spacing:.06em;color:var(--k);text-shadow:0 0 12px rgba(0,240,255,.8),0 0 2px #fff}
.core{position:relative;margin:0 12px 0 11px;width:20px;height:20px;background:radial-gradient(circle,#e6ffff 0 26%,var(--k) 46%,rgba(0,240,255,0) 74%);box-shadow:0 0 16px rgba(0,240,255,.8)}
.core::before,.core::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:14px;margin:-7px 0 0 -17px;border:1.5px solid var(--k);border-radius:50%}
.core::after{width:42px;height:18px;margin:-9px 0 0 -21px;border-color:var(--k2);opacity:.9}
.hr{display:flex;align-items:center;gap:8px}
.tagai{font-size:11px;letter-spacing:.06em;color:var(--k2);text-shadow:0 0 8px rgba(255,43,214,.6)}
.plan{font-family:JB,monospace;border-radius:8px;border-color:rgba(255,43,214,.5);color:var(--k2)}
/* неон-коробка как в боте: тёмная заливка, cyan обводка с ореолом, уголки */
.card,.list,.pl,.sj,.holo{background:var(--c1);border:1.5px solid rgba(0,240,255,.55);border-radius:18px;
 box-shadow:0 0 0 1px rgba(0,240,255,.07),0 0 18px -2px rgba(0,240,255,.35),inset 0 0 22px -8px rgba(0,240,255,.25)}
.card.pk,.pl.hit{border-color:rgba(255,43,214,.7);box-shadow:0 0 18px -2px rgba(255,43,214,.45),inset 0 0 22px -8px rgba(255,43,214,.3)}
.card.vi{border-color:rgba(140,82,255,.7);box-shadow:0 0 18px -2px rgba(140,82,255,.45),inset 0 0 22px -8px rgba(140,82,255,.3)}
.frame{outline:1.5px solid rgba(255,43,214,.55);outline-offset:5px;border-radius:18px}
.card::after,.frame::after{content:"";position:absolute;inset:-6px;pointer-events:none;--b:var(--k);
 background:linear-gradient(var(--b),var(--b)) 0 0/14px 2px,linear-gradient(var(--b),var(--b)) 0 0/2px 14px,linear-gradient(var(--b),var(--b)) 100% 0/14px 2px,linear-gradient(var(--b),var(--b)) 100% 0/2px 14px,
 linear-gradient(var(--b),var(--b)) 0 100%/14px 2px,linear-gradient(var(--b),var(--b)) 0 100%/2px 14px,linear-gradient(var(--b),var(--b)) 100% 100%/14px 2px,linear-gradient(var(--b),var(--b)) 100% 100%/2px 14px;background-repeat:no-repeat;filter:drop-shadow(0 0 4px var(--b))}
.card.pk::after{--b:var(--k2)}.card.vi::after{--b:var(--vi)}
.holo{border-color:rgba(255,43,214,.8);background:radial-gradient(80% 60% at 50% 0,rgba(255,43,214,.18),transparent 70%),var(--c1)}
.btn{border-radius:14px;font-family:UB,sans-serif;text-transform:uppercase;font-size:13px;letter-spacing:.04em;background:linear-gradient(100deg,#00f0ff,#6ff9ff);box-shadow:0 0 22px -4px rgba(0,240,255,.8),inset 0 0 0 1px rgba(255,255,255,.35)}
.btn.ghost{color:var(--k);border:1.5px solid rgba(0,240,255,.5);background:rgba(0,240,255,.04);box-shadow:none}
.btn.gold{color:#fff;background:linear-gradient(100deg,#ff2bd6,#8c52ff);box-shadow:0 0 24px -4px rgba(255,43,214,.8)}
.big,.lim .num,.pl b{text-shadow:0 0 14px rgba(255,255,255,.25)}
.bar{background:rgba(40,46,90,.8)}.bar i{box-shadow:0 0 10px var(--k)}
.tabs{border-top:1.5px solid rgba(0,240,255,.25);background:linear-gradient(0deg,rgba(5,6,15,.96),rgba(5,6,15,.7));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs button{font-family:JB,monospace;text-transform:uppercase;font-size:10px;letter-spacing:.04em}
.tabs button.on{color:var(--k);text-shadow:0 0 8px rgba(0,240,255,.7)}
.li .ic{border-color:rgba(0,240,255,.3);background:rgba(0,240,255,.06)}
.chip{font-family:JB,monospace;border-color:rgba(0,240,255,.35);background:rgba(0,240,255,.04)}
.chip.on,.chip:active{border-color:var(--k2);color:var(--k2);box-shadow:0 0 12px -2px rgba(255,43,214,.6)}
/* ── мессенджер ── */
.chat{display:flex;flex-direction:column;height:100%}
.ctop{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.ctop .t1{font-size:20px;margin:0;flex:1}
.net{display:inline-flex;align-items:center;gap:6px;font:11px JB,monospace;color:var(--mut)}
.net i{width:8px;height:8px;border-radius:50%;background:#666b90}
.net.on i{background:#3dffa8;box-shadow:0 0 8px #3dffa8}.net.wait i{background:#ffc43c;animation:blink 1s infinite}

 else if(m.t)s+=m.me?"<p>"+esc(m.t).replace(/\n/g,"<br>")+"</p>":md(m.t);
 s+="</div>";

 return s+"<div class='tm'>"+(m.ts?hhmm(m.ts):"")+"</div></div>";}
var typT=0,typI=0;
function typHTML(){var pool=data.m==="ultra"?THINK.ultra:(THINK[data.role]||THINK.universal);return "<div class='msg bot typ' id='typ'><div class='bub'><span class='dots'><i></i><i></i><i></i></span><span id='typt'>Ядро печатает… "+esc(pool[typI%pool.length])+"</span></div></div>";}

 return thread.map(function(m,i){return msgHTML(m,i,i===lastBot);}).join("")+(thinking?typHTML():"");}

function bindLog(){[].forEach.call(document.querySelectorAll("[data-cp]"),function(x){x.onclick=function(){var m=thread[Number(x.getAttribute("data-cp"))];if(m)copyText(m.answer?((m.steps?m.steps+"\n\n":"")+m.answer):m.t,"Скопировал ⧉");tap("sel");};});
 [].forEach.call(document.querySelectorAll("[data-sv]"),function(x){x.onclick=function(){var i=Number(x.getAttribute("data-sv")),m=thread[i];if(!m)return;var q="";for(var j=i-1;j>=0;j--)if(thread[j].me){q=thread[j].t||"";break;}addNote((q||"Ответ Ядра").slice(0,80),m.answer||m.t);tap("good");sound("good");toast("В шпорах 📚");};});
 [].forEach.call(document.querySelectorAll("[data-easy]"),function(x){x.onclick=function(){tap("mid");sendText("Объясни проще, как другу из 5 класса, свой последний ответ. Коротко и с примером.","🧩 Объясни проще");};});}

 s+="<div class='offb' id='offb' style='display:"+(netOK()?"none":"flex")+"'><span>📡</span><span><b>"+(API&&inside?"Ядро не отвечает.":"Офлайн-режим.")+"</b> Примеры считаю тут, остальное скопирую и закрою окно — вставь вопрос боту в чат.</span></div>";

 s+="<div id='pendw'>"+pendHTML()+"</div><div class='comp' id='comp'><button class='ib' id='att' aria-label='Фото'>📎</button><textarea id='q' maxlength='4000' placeholder='Задача, вопрос, пример…'></textarea>"+

 return s;};

/* ── отправка ── */
async function sendText(text,shown){if(thinking)return;tap();pushMsg({me:1,t:shown||text});pushHist(shown||text);
 var m=safeMath(text);if(m!==null&&!shown){pushBot("= "+m);return;}
 if(!netOK()||!inside){offlineSend(text);return;}
 if(empty()){pushBot(FAIL.limit+(prem()?"":" Или глянь 💎 Premium."),{note:1});return;}
 await liveRun(function(){return call("/app/ask",{q:text,ultra:data.m==="ultra"});});}
function offlineSend(text){if(OWN&&inside){thread.pop();var q=$("q");if(q)q.value=text;onSendOld();return;}
 pushBot("Ядро сейчас не на связи из приложения. Скопировал вопрос — вставь его боту, ответ прилетит туда 👇",{note:1});
 copyText(text,"Вопрос скопирован",function(ok){if(ok&&tg&&inside){setTimeout(function(){try{tg.close();}catch(e){}},1400);}});}
async function liveRun(start,mine){thinking=true;typI=Math.floor(Math.random()*6);drawLog();
 try{var j=await start();if(!j.ok){thinking=false;tap("bad");pushBot(failText(j),{note:1});return;}
  var r=await waitJob(j.job);thinking=false;
  if(mine&&r.heard){mine.t=(mine.vo?"":"📷 ")+r.heard;saveThread();}
  if(!r.ok){tap("bad");pushBot(failText(r),{note:1});return;}
  if(typeof r.left==="number")data.u=Math.max(0,lim()-r.left);
  tap("good");sound("good");var p=r.parts&&r.parts.answer?r.parts:{};pushBot(r.text||"Пусто.",p);
 }catch(e){thinking=false;tap("bad");pushBot("Связь с Ядром оборвалась. Если ответа не было — импульс не списан.",{note:1});}}
var onSend=async function(){var box=$("q");if(!box)return;var text=box.value.trim();
 if(pend){var p=pend;pend=null;box.value="";var pw=$("pendw");if(pw)pw.innerHTML="";sendBtnPaint();sendPhoto(p,text);return;}
 if(!text){return;}try{localStorage.removeItem("synapse_draft");}catch(e){}box.value="";box.style.height="48px";sendBtnPaint();sendText(text);};
async function sendPhoto(p,caption){if(thinking)return;tap("mid");var mine={me:1,img:p.thumb,t:caption||""};pushMsg(mine);
 if(!netOK()){pushBot("Фото разбираю, только когда Ядро на связи. Кинь его боту в чат — там разберу 📸",{note:1});return;}
 var f=new FormData();f.append("image",p.blob,"photo.jpg");if(caption)f.append("caption",caption);
 await liveRun(function(){return call("/app/photo",null,f);},mine);}

/* ── фото: камера/галерея, сжатие < 1.5 МБ ── */
function pickPhoto(cam){var i=document.createElement("input");i.type="file";i.accept="image/*";if(cam)i.setAttribute("capture","environment");
 i.onchange=function(){var f=i.files&&i.files[0];if(f)compress(f);};i.click();}
function compress(file){var url=URL.createObjectURL(file),img=new Image();
 img.onload=function(){var side=1600,q=.82;function pass(){var k=Math.min(1,side/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){if(!b){toast("Фото не прочиталось");return;}
    if(b.size>1450000&&side>600){side=Math.round(side*.8);q=Math.max(.6,q-.08);pass();return;}
    var t=document.createElement("canvas"),tk=240/Math.max(c.width,c.height);t.width=Math.round(c.width*tk);t.height=Math.round(c.height*tk);t.getContext("2d").drawImage(c,0,0,t.width,t.height);
    pend={blob:b,thumb:t.toDataURL("image/jpeg",.7)};URL.revokeObjectURL(url);var pw=$("pendw");if(pw){pw.innerHTML=pendHTML();var x=$("pendx");if(x)x.onclick=function(){pend=null;pw.innerHTML="";sendBtnPaint();tap("sel");};}
    sendBtnPaint();tap("light");var q2=$("q");if(q2)q2.focus();},"image/jpeg",q);}pass();};
 img.onerror=function(){URL.revokeObjectURL(url);tap("bad");toast("Это не картинка 🤔");};img.src=url;}
function attSheet(){tap("sel");var s=document.createElement("div");s.className="sheet";
 s.innerHTML="<div><div class='lbl' style='margin-top:0'>Прикрепить</div><button class='btn' id='shc'>📷 Камера</button><button class='btn ghost' id='shg'>🖼 Галерея</button></div>";
 document.body.appendChild(s);s.onclick=function(e){if(e.target===s)s.remove();};
 $("shc").onclick=function(){s.remove();pickPhoto(true);};$("shg").onclick=function(){s.remove();pickPhoto(false);};}

/* ── голос: зажми и говори ── */
var REC={on:false,mr:null,chunks:[],t0:0,x0:0,cancel:false,timer:0,stream:null};
function recMax(){return prem()||data.p==="trial"?180:60;}
async function recStart(ev){if(REC.on||thinking)return;if(!netOK()){tap("warn");toast("Голос — когда Ядро на связи. Или кинь голосовое боту 🎙");return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){tap("bad");toast("Тут запись не поддерживается — кинь голосовое боту");return;}
 REC.x0=ev.clientX;REC.cancel=false;REC.on=true;
 try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}catch(e){REC.on=false;tap("bad");toast("Нет доступа к микрофону");return;}
 if(!REC.on){REC.stream.getTracks().forEach(function(t){t.stop();});return;}
 var types=["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4","audio/webm"],mt="";for(var i=0;i<types.length;i++){try{if(MediaRecorder.isTypeSupported(types[i])){mt=types[i];break;}}catch(e){}}
 try{REC.mr=new MediaRecorder(REC.stream,mt?{mimeType:mt,audioBitsPerSecond:32000}:undefined);}catch(e){REC.mr=new MediaRecorder(REC.stream);}
 REC.chunks=[];REC.mr.ondataavailable=function(e){if(e.data&&e.data.size)REC.chunks.push(e.data);};REC.mr.onstop=recDone;
 REC.mr.start(250);REC.t0=Date.now();tap("mid");sound("click");var c=$("comp"),b=$("send");if(c)c.classList.add("recing");if(b)b.classList.add("rec");
 clearInterval(REC.timer);REC.timer=setInterval(function(){var s=Math.floor((Date.now()-REC.t0)/1000),t=$("rect");if(t)t.textContent=mmss(s);if(s>=recMax()){tap("warn");recStop(false);}},250);}
function recStop(cancel){if(!REC.on)return;REC.on=false;REC.cancel=!!cancel;clearInterval(REC.timer);var c=$("comp"),b=$("send");if(c)c.classList.remove("recing");if(b)b.classList.remove("rec");
 try{if(REC.mr&&REC.mr.state!=="inactive")REC.mr.stop();else recDone();}catch(e){recDone();}}
function recDone(){if(REC.stream){REC.stream.getTracks().forEach(function(t){t.stop();});REC.stream=null;}
 var sec=Math.round((Date.now()-REC.t0)/1000);if(REC.cancel){tap("warn");toast("Отменил");return;}
 if(sec<1||!REC.chunks.length){tap("warn");toast("Зажми и держи, пока говоришь 🎙");return;}
 var blob=new Blob(REC.chunks,{type:(REC.mr&&REC.mr.mimeType)||"audio/webm"});REC.chunks=[];
 if(blob.size>1900000){tap("bad");toast("Слишком длинно — разбей на части");return;}
 tap("light");var mine={me:1,vo:sec,t:""};pushMsg(mine);var f=new FormData();f.append("audio",blob,"voice");
liveRun(function(){return call("/app/voice",null,f);},mine);}

 var fresh=j.items.map(function(it){var me=it.r==="user",p=me?null:splitPlates(it.c);return p?{me:0,t:it.c,steps:p.steps,answer:p.answer,check:p.check,ts:it.t*1000}:{me:me?1:0,t:it.c,ts:it.t*1000};});
