<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synapse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; --cyan:#5cf2ff; --mag:#ff4fd8; --gold:#ffd15a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060d; color: #e9f7ff; }
  body { font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden;
    display: flex; justify-content: center;
    background:
      radial-gradient(900px 420px at 15% 20%, rgba(80,220,255,.12), transparent 55%),
      radial-gradient(700px 380px at 85% 80%, rgba(255,79,216,.1), transparent 50%),
      #05060d; }
  .app {
    width: min(480px, 100%); height: 100dvh; display: flex; flex-direction: column;
    padding: calc(8px + env(safe-area-inset-top)) 12px 0;
  }
  header { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .logo { font-weight: 800; letter-spacing: .06em; font-size: 14px; }
  .logo b { color: var(--cyan); }
  .sub { margin-top: 2px; color: #8ea3b8; font-size: 12px; }
  .badge { border: 1px solid rgba(92,242,255,.5); color: var(--cyan); border-radius: 999px; padding: 4px 10px; font-size: 11px; letter-spacing: .12em; }
  .stage { position: relative; min-height: 0; }
  .stage.tall { flex: 1; }
  .stage.short { height: 148px; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .card { margin: 0 0 8px; padding: 12px; border-radius: 18px; background: rgba(10,12,24,.9); border: 1px solid rgba(120,210,255,.16); min-height: 0; }
  .card.chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; color: var(--cyan); }
  h2.mag { color: var(--mag); }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .muted { color: #8ea3b8; font-size: 13px; }
  .bar { height: 7px; margin: 10px 0 12px; border-radius: 99px; background: #1a2236; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2ad4ff, #ff4fd8); }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 24px; }
  .stats span { color: #8ea3b8; font-size: 11px; letter-spacing: .08em; }
  button.go, .plan {
    font: inherit;
  }
  button.go { display: block; width: 100%; margin-top: 10px; padding: 12px; border: 0; border-radius: 14px; color: #061018; font-weight: 800; background: linear-gradient(90deg, #2ad4ff, #ff4fd8); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plan { text-align: left; padding: 10px; border-radius: 14px; color: inherit; background: rgba(6,8,18,.75); border: 1px solid rgba(140,160,190,.25); }
  .plan.hit { border-color: #ff4fd8; box-shadow: 0 0 18px rgba(255,79,216,.28); }
  .plan small { display: block; color: #8ea3b8; }
  .plan b { display: block; margin: 4px 0; color: var(--gold); font-size: 22px; }
  .tag { float: right; background: #ff4fd8; color: #1a0614; border-radius: 8px; font-size: 10px; padding: 2px 6px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
  .chips button { flex: none; border: 1px solid rgba(92,242,255,.35); background: #081420; color: #d8fbff; border-radius: 999px; padding: 6px 10px; font: inherit; font-size: 12px; }
  .log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 90%; padding: 8px 10px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .me { margin-left: auto; background: rgba(40,180,255,.16); border: 1px solid rgba(92,242,255,.28); }
  .bot { margin-right: auto; background: rgba(255,79,216,.1); border: 1px solid rgba(255,79,216,.25); }
  .composer { display: flex; gap: 8px; margin-top: 8px; }
  textarea { flex: 1; resize: none; height: 46px; border-radius: 12px; border: 1px solid rgba(92,242,255,.3); background: #070b14; color: #e9f7ff; font: inherit; padding: 10px; }
  .composer button { width: 74px; border: 0; border-radius: 12px; font: inherit; font-weight: 800; color: #061018; background: linear-gradient(180deg, #8af7ff, #2ad4ff); }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #071018; border: 1px solid rgba(92,242,255,.45); color: #e9f7ff; border-radius: 999px; padding: 8px 14px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  video.hero { width: 100%; border-radius: 14px; margin-top: 8px; background: #05060d; }
  .leftline { color: #8ea3b8; font-size: 12px; margin: 0 0 6px; }
  .plate { margin: 4px 0; padding: 8px; border-radius: 12px; background: rgba(6,14,24,.85); }
  .shot { position: relative; padding: 18px 14px 14px; border-radius: 18px; min-height: 168px;
    background:
      radial-gradient(140px 80px at 12% 0%, rgba(92,242,255,.28), transparent 70%),
      radial-gradient(160px 100px at 100% 100%, rgba(255,79,216,.22), transparent 72%),
      #070b14;
    box-shadow: inset 0 0 0 1px rgba(92,242,255,.5), 0 0 28px rgba(92,242,255,.14); }
  .shot i { display: block; font-style: normal; font-size: 10px; letter-spacing: .22em; color: #5cf2ff; }
  .shot b { display: block; margin: 12px 0 8px; font-size: 20px; line-height: 1.25; }
  .shot em { display: block; margin-top: 8px; color: #d5e7f2; font-style: normal; font-size: 14px; white-space: pre-wrap; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  nav button { border: 0; border-radius: 14px; padding: 8px 2px; background: transparent; color: #8ea3b8; font: inherit; font-size: 11px; }
  nav button.on { color: #fff; background: rgba(16,28,44,.95); box-shadow: inset 0 0 0 1px rgba(92,242,255,.3); }
  nav svg { display: block; margin: 0 auto 3px; }
  @media (min-width: 960px) {
    .app {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: minmax(340px, 46%) minmax(360px, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      column-gap: 14px;
      padding: 16px 18px 12px;
    }
    header { grid-column: 1 / -1; }
    .stage, .stage.short, .stage.tall { grid-column: 1; grid-row: 2 / 4; height: auto; min-height: 0; }
    #panel { grid-column: 2; grid-row: 2; margin: 0; min-height: 0; }
    nav { grid-column: 2; grid-row: 3; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><div class="logo">SYNAPSE<b>//CORE</b></div><div class="sub" id="sub">Связь</div></div>
    <div class="badge" id="badge">FREE</div>
  </header>
  <div class="stage tall" id="stage"><canvas id="atom"></canvas></div>
  <section class="card" id="panel"></section>
  <nav>
    <button type="button" data-tab="chat" class="on"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 4.5h12v7.2H7.2L3 14.2V4.5Z" stroke="currentColor"/></svg>Чат</button>
    <button type="button" data-tab="shot"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="3.5" width="12" height="11" rx="2" stroke="currentColor"/><path d="M7 8.5h4M6 11h6" stroke="currentColor"/></svg>Кадр</button>
    <button type="button" data-tab="spark"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1.5 10.4 7H16l-4.5 3.3L13.2 16 9 12.6 4.8 16l1.7-5.7L2 7h5.6L9 1.5Z" stroke="currentColor"/></svg>Искра</button>
    <button type="button" data-tab="prem"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2 11 7h5l-4 3 1.5 5L9 12 4.5 15 6 10 2 7h5L9 2Z" stroke="currentColor"/></svg>Premium</button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script>
var LABELS = { week:["7 дней","попробовать"], month:["30 дней","оптимально"], year:["365 дней","−50% к месяцу"], forever:["навсегда","один раз"] };
var CHIPS = ["Объясни: ", "Проверь: ", "Код: ", "Короче: ", "План: "];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";";});}
function readParam(){
  var q=new URLSearchParams(location.search).get("d")||""; if(!q) return null;
  q=q.replace(/-/g,"+").replace(/_/g,"/"); while(q.length%4) q+="=";
  var bin=atob(q), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
var tg=window.Telegram&&window.Telegram.WebApp;
var inside=!!(tg&&tg.initData);
var OWN=/\/app\/?$/.test(location.pathname);
if(tg){ tg.ready(); try{tg.expand();}catch(e){} try{ if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){}
  try{ tg.setHeaderColor("#05060d"); tg.setBackgroundColor("#05060d"); }catch(e){} }
var live=null; if(inside){ try{ live=readParam(); }catch(e){ live=null; } }
var demo={n:"Нео",p:"trial",u:2,l:20,ux:4,s:5,r:7,w:0,rk:"Оператор",sp:0,b:"core_synapse_bot",m:"flash",
  pr:[["week","",90],["month","",250],["year","",1500],["forever","",6000]]};
var forged=!inside && location.search.indexOf("d=")>=0;
var data=live||demo;
var bot=String(data.b||"core_synapse_bot").replace(/[^A-Za-z0-9_]/g,"")||"core_synapse_bot";
var tab="chat", best=0, thread=[], energy=0, tiltX=0, tiltY=0, thinking=false;
try{ best=Number(localStorage.getItem("synapse_spark_best")||0)||0; }catch(e){}
try{ thread=JSON.parse(localStorage.getItem("synapse_thread")||"[]"); if(!Array.isArray(thread)) thread=[]; thread=thread.slice(-24);}catch(e){ thread=[]; }
function planName(p){ return p==="premium"?"PREMIUM":p==="trial"?"TRIAL":"FREE"; }
function leftImp(){ return Math.max(0,(Number(data.l)||0)-(Number(data.u)||0)); }
function hot(){ return leftImp()<=0 && data.p!=="premium"; }
function go(start){
  var url="https://t.me/"+bot+"?start="+encodeURIComponent(start);
  if(tg&&tg.openTelegramLink) tg.openTelegramLink(url); else location.href=url;
}
function toast(text){
  var n=document.getElementById("toast"); n.textContent=text; n.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){n.classList.remove("on");},1600);
}
var actx;
function blip(freq){
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=actx||new AC();
    var o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=freq; g.gain.value=0.03;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.08); o.stop(actx.currentTime+0.09);
  }catch(e){}
}
function tap(kind){
  blip(kind==="bad"?170:kind==="good"?720:440);
  if(tg&&tg.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred(kind==="bad"?"heavy":"light"); }catch(e){} }
}
function saveThread(){ try{ localStorage.setItem("synapse_thread", JSON.stringify(thread.slice(-24))); }catch(e){} }
function safeMath(text){
  var s=String(text||"").trim();
  if(!/^[0-9+\-*/().\s]+$/.test(s)||s.length>40||!/[0-9]/.test(s)) return null;
  try{ var n=Function('"use strict";return('+s+")")(); if(typeof n!=="number"||!isFinite(n)) return null; return Math.round(n*1000)/1000; }
  catch(e){ return null; }
}
function render(){
  document.getElementById("badge").textContent=planName(data.p||"free");
  document.getElementById("sub").textContent = forged ? "Открой кнопкой в боте" : ((data.n||"ты")+" · "+(data.p==="premium"?"premium":data.p==="trial"?"демо":"free"));
  var stage=document.getElementById("stage");
  stage.className="stage "+(tab==="chat"?"short":"tall");
  var html="", panel=document.getElementById("panel");
  if(forged){ panel.className="card"; panel.innerHTML="<p class='muted'>Чужие цифры из адреса не показываю.</p>"; return; }
  if(inside&&!live&&!OWN){ panel.className="card"; panel.innerHTML="<p class='muted'>Нет цифр. Напиши боту слово и открой кнопку снова.</p>"; return; }
  if(tab==="chat"){
    panel.className="card chat";
    html="<div class='chips'>";
    CHIPS.forEach(function(c,i){ html+="<button type='button' data-chip='"+i+"'>"+esc(c.replace(": ",""))+"</button>"; });
    html+="</div><div class='log' id='log'>";
    if(!thread.length) html+="<p class='muted'>"+(OWN?"Пиши сюда. Ответ ляжет плашками: шаги, ответ, проверка.":"Пиши сюда. Счёт посчитаю сразу. Живой ответ включается из кнопки бота.")+"</p>";
    thread.forEach(function(m){
      if(!m.me && (m.steps || m.check)){
        html+="<div class='bubble bot'>";
        if(m.steps) html+="<div class='plate'><b>ШАГИ</b>"+esc(m.steps)+"</div>";
        html+="<div class='plate'><b>ОТВЕТ</b>"+esc(m.answer||m.t)+"</div>";
        if(m.check) html+="<div class='plate'><b>ПРОВЕРКА</b>"+esc(m.check)+"</div>";
        html+="</div>";
      } else html+="<div class='bubble "+(m.me?"me":"bot")+"'>"+esc(m.t)+"</div>";
    });
    if(thinking) html+="<div class='bubble bot'>Ядро собирает ответ…</div>";
    html+="</div><div class='leftline'>Осталось "+leftImp()+". Если ядро молчит, импульс вернётся.</div>";
    html+="<div class='composer'><textarea id='q' maxlength='2000' placeholder='Задача'></textarea><button type='button' id='send'>ПУСК</button></div>";
  } else if(tab==="shot"){
    panel.className="card";
    var shot=lastShot();
    html="<h2>КАДР</h2><p class='muted'>Последний ответ, одним плакатом. Модель не зовёт.</p>";
    html+="<div class='shot'><i>SYNAPSE</i><b>"+esc(shot.q||"Сначала спроси во вкладке Чат")+"</b>";
    html+="<em>"+esc(shot.a||"Здесь появится ответ.")+"</em>";
    html+="<span class='muted' style='display:block;margin-top:10px'>"+esc(data.n||"ты")+" · осталось "+leftImp()+"</span></div>";
    html+="<button class='go' type='button' id='copy' "+(shot.a?"":"disabled")+">СКОПИРОВАТЬ</button>";
  } else if(tab==="spark"){
    panel.className="card";
    html="<h2 class='mag'>ПОЙМАЙ ИСКРУ</h2><p class='muted'>20 секунд. Золото копится серией, красная трясёт экран. Игра импульс не ест.</p>";
    html+="<div class='row'><span class='muted'>Рекорд</span><b>"+best+"</b></div><div class='row'><span class='muted'>Сейчас</span><b id='score'>0</b></div>";
    html+="<button class='go' type='button' id='play'>"+(playing?"ИГРА ИДЁТ":"ИГРАТЬ")+"</button>";
    html+=Number(data.sp)?"<p class='muted'>Искра дня уже забрана.</p>":"<button class='go' type='button' id='claim' style='background:#142033;color:#e9f7ff'>ЗАБРАТЬ ИСКРУ ДНЯ</button>";
  } else {
    panel.className="card";
    html="<h2 class='mag'>СОРВАТЬ ЛИМИТЫ</h2><p class='muted'>Оплата звёздами на этом экране, без ленты чата.</p><div class='grid'>";
    (data.pr||[]).forEach(function(row){
      var key=String(row[0]||""), lab=LABELS[key]||[row[1]||key,""], hit=key==="month";
      html+="<button class='plan"+(hit?" hit":"")+"' type='button' data-buy='"+esc(key)+"'>";
      if(hit) html+="<span class='tag'>ХИТ</span>";
      html+="<small>"+esc(lab[0])+"</small><b>"+esc(row[2])+" ★</b><small>"+esc(lab[1])+"</small></button>";
    });
    html+="</div>";
    if(data.p==="premium") html+="<p class='muted'>Premium уже включён.</p>";
    if(OWN) html+="<video class='hero' muted loop playsinline autoplay src='/media/neon/premium.mp4'></video>";
  }
  panel.innerHTML=html;
  var log=document.getElementById("log"); if(log) log.scrollTop=log.scrollHeight;
  Array.prototype.forEach.call(document.querySelectorAll("[data-chip]"), function(btn){
    btn.onclick=function(){ var box=document.getElementById("q"); if(!box) return; box.value=CHIPS[Number(btn.getAttribute("data-chip"))]||""; box.focus(); tap(); };
  });
  var send=document.getElementById("send"); if(send) send.onclick=onSend;
  var q=document.getElementById("q");
  if(q){
    try{ var draft=localStorage.getItem("synapse_draft"); if(draft && !q.value) q.value=draft; }catch(e){}
    q.addEventListener("keydown", function(ev){ if(ev.key==="Enter"&&!ev.shiftKey){ ev.preventDefault(); onSend(); } });
    q.addEventListener("input", function(){ energy=1; try{ localStorage.setItem("synapse_draft", q.value); }catch(e){} });
  }
  var copy=document.getElementById("copy"); if(copy) copy.onclick=function(){ var shot=lastShot(); if(!shot.a) return; var text=(shot.q?shot.q+"\n":"")+shot.a; tap("good");
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ toast("Скопировал"); }, function(){ toast("Не вышло"); }); }
    else toast("Не вышло"); };
  var play=document.getElementById("play"); if(play) play.onclick=function(){ tap(); startGame(); };
  var claim=document.getElementById("claim"); if(claim) claim.onclick=function(){ tap("good"); go("spark"); };
  Array.prototype.forEach.call(document.querySelectorAll("[data-buy]"), function(btn){
    btn.onclick=function(){ var key=btn.getAttribute("data-buy")||""; if(/^[a-z0-9_]+$/.test(key)) buy(key); };
  });
  var vid=panel.querySelector("video"); if(vid) vid.addEventListener("error", function(){ vid.remove(); });
}
function lastShot(){
  var q="", a="";
  for(var i=thread.length-1;i>=0;i--){
    if(!a && !thread[i].me) a=thread[i].answer||thread[i].t||"";
    else if(a && thread[i].me){ q=thread[i].t||""; break; }
  }
  return {q:String(q).slice(0,180), a:String(a).slice(0,420)};
}
function pushBot(text, parts){
  parts=parts||{};
  thread.push({me:0,t:text,steps:parts.steps||"",answer:parts.answer||"",check:parts.check||""});
  saveThread(); render();
}
async function onSend(){
  if(thinking) return;
  var box=document.getElementById("q"); if(!box) return;
  var text=box.value.trim(); if(!text) return;
  try{ localStorage.removeItem("synapse_draft"); }catch(e){}
  tap("good"); energy=1; box.value="";
  thread.push({me:1,t:text}); saveThread();
  var math=safeMath(text);
  if(math!==null){ pushBot(String(math)); toast("Посчитал здесь"); return; }
  if(!OWN||!inside){ pushBot("Живой ответ включается только из кнопки бота на твоём ядре."); return; }
  thinking=true; render();
  var hist=thread.slice(-8,-1).map(function(m){ return {role:m.me?"user":"assistant", content:m.t}; });
  try{
    var r=await fetch("/app/ask",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({init:tg.initData,q:text,ultra:data.m==="ultra",h:hist})});
    var j=await r.json();
    thinking=false;
    if(!j.ok){
      var why=j.error==="limit"?"Импульсы кончились.":j.error==="pause"?"Ядро на паузе.":j.error==="fast"?"Слишком часто. Секунду.":"Ядро не ответило. Импульс не сгорел.";
      pushBot(why); return;
    }
    if(typeof j.left==="number"){ data.u=Math.max(0,(Number(data.l)||0)-j.left); }
    burstXY=1; pushBot(j.text||"Пусто.", j.parts||{});
  }catch(e){ thinking=false; pushBot("Связь с ядром оборвалась. Импульс не трогаю, если ответа не было."); }
}
async function buy(key){
  tap("good");
  if(!OWN||!tg||!tg.openInvoice||!inside){ go("buy_"+key); return; }
  try{
    var r=await fetch("/app/invoice",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({init:tg.initData,key:key})});
    var j=await r.json();
    if(!j.ok||!j.url){ toast("Счёт не открылся"); return; }
    tg.openInvoice(j.url, function(status){
      if(status==="paid"){ data.p="premium"; burstXY=1; toast("Premium включён"); render(); }
      else if(status==="cancelled") toast("Отменил");
      else toast("Не прошло");
    });
  }catch(e){ go("buy_"+key); }
}
async function refreshMe(){
  if(!OWN||!inside) return;
  try{
    var body=new URLSearchParams(); body.set("init", tg.initData);
    var r=await fetch("/app/me",{method:"POST",body:body});
    if(!r.ok) return;
    var j=await r.json();
    if(j&&j.b){ data=j; live=j; render(); }
  }catch(e){}
}
var canvas=document.getElementById("atom"), ctx=canvas.getContext("2d");
var sparks=[], bursts=[], floats=[], playing=false, gameUntil=0, score=0, lives=3, combo=0, spawnAt=0, shake=0, burstXY=0;
function resize(){
  var r=canvas.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  var w=Math.max(1,Math.floor(r.width*dpr)), h=Math.max(1,Math.floor(r.height*dpr));
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
}
function spray(x,y,color){ for(var i=0;i<12;i++){ var a=Math.random()*6.28, s=1+Math.random()*3; bursts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:color}); } }
function startGame(){ playing=true; score=0; lives=3; combo=0; sparks=[]; gameUntil=performance.now()+20000; spawnAt=0; render(); }
function endGame(){
  playing=false; sparks=[];
  if(score>best){ best=score; try{localStorage.setItem("synapse_spark_best",String(best));}catch(e){} toast("Новый рекорд "+score); }
  else toast("Счёт "+score);
  render();
}
canvas.addEventListener("pointerdown", function(ev){
  var rect=canvas.getBoundingClientRect();
  var x=(ev.clientX-rect.left)*(canvas.width/rect.width), y=(ev.clientY-rect.top)*(canvas.height/rect.height);
  if(!playing){ spray(x,y,"#7af6ff"); shake=5; tap(); return; }
  var bestI=-1, bestD=48*(canvas.width/Math.max(rect.width,1));
  for(var i=0;i<sparks.length;i++){ var d=Math.hypot(sparks[i].x-x,sparks[i].y-y); if(d<bestD){ bestD=d; bestI=i; } }
  if(bestI<0) return;
  var got=sparks.splice(bestI,1)[0];
  if(got.gold){ combo++; var gain=3*Math.min(combo,5); score+=gain; spray(got.x,got.y,"#ffd15a"); floats.push({x:got.x,y:got.y,t:"+"+gain,life:1}); tap("good"); }
  else { combo=0; lives--; score=Math.max(0,score-1); shake=9; spray(got.x,got.y,"#ff3b5c"); tap("bad"); }
  var sc=document.getElementById("score"); if(sc) sc.textContent=String(score);
  if(lives<=0) endGame();
});
window.addEventListener("deviceorientation", function(ev){
  tiltX=Math.max(-1,Math.min(1,(ev.gamma||0)/35));
  tiltY=Math.max(-1,Math.min(1,(ev.beta||0)/45));
});
function frame(t){
  resize();
  var w=canvas.width,h=canvas.height,cx=w/2+tiltX*w*0.08, cy=h/2+tiltY*h*0.06;
  ctx.clearRect(0,0,w,h);
  var shook = shake > 0;
  if (shook) {
    ctx.save();
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85;
    if (shake < 0.4) shake = 0;
  }
  energy*=0.96;
  var over=hot(), prem=data.p==="premium", speed=(over?2.1:1)*(thinking?1.8:1)*(1+energy);
  var orbits=[
    {rx:w*0.32,ry:h*0.16,rot:0.4+t*0.00035*speed,color:over?"#ff3b5c":"#ff4fd8",n:14},
    {rx:w*0.18,ry:h*0.28,rot:-0.6+t*0.0005*speed,color:over?"#ffb020":"#3ee7ff",n:12},
    {rx:w*0.36,ry:h*0.18,rot:1.1-t*0.00022*speed,color:prem?"#ffd15a":"#8d6bff",n:10}
  ];
  var nodes=[];
  orbits.forEach(function(o){
    ctx.beginPath(); ctx.strokeStyle=o.color; ctx.globalAlpha=0.9; ctx.lineWidth=Math.max(1.2,w*0.004);
    for(var i=0;i<=48;i++){ var a=o.rot+i/48*6.28, x=cx+Math.cos(a)*o.rx, y=cy+Math.sin(a)*o.ry; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
    for(var k=0;k<o.n;k++){ var a2=o.rot+k/o.n*6.28; nodes.push({x:cx+Math.cos(a2)*o.rx,y:cy+Math.sin(a2)*o.ry,c:o.color}); }
  });
  ctx.globalAlpha=0.25; ctx.strokeStyle=over?"#ff8aa0":"#7ee7ff"; ctx.lineWidth=1;
  for(var a=0;a<nodes.length;a++) for(var b=a+1;b<nodes.length;b++){
    var dx=nodes[a].x-nodes[b].x, dy=nodes[a].y-nodes[b].y;
    if(dx*dx+dy*dy<(w*0.2)*(w*0.2)){ ctx.beginPath(); ctx.moveTo(nodes[a].x,nodes[a].y); ctx.lineTo(nodes[b].x,nodes[b].y); ctx.stroke(); }
  }
  ctx.globalAlpha=1;
  nodes.forEach(function(n){ ctx.beginPath(); ctx.fillStyle=n.c; ctx.arc(n.x,n.y,Math.max(2,w*0.008),0,6.28); ctx.fill(); });
  var rad=Math.max(16,w*0.11)*(0.92+0.08*Math.sin(t*(thinking?0.02:0.004)));
  var g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad*2.3);
  g.addColorStop(0,"#fff"); g.addColorStop(0.35,over?"rgba(255,80,100,.7)":"rgba(80,230,255,.65)"); g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,rad*2.3,0,6.28); ctx.fill();
  if(burstXY){ spray(cx,cy,"#ffd15a"); burstXY=0; }
  if(playing){
    if(t>gameUntil) endGame();
    else {
      if(t>spawnAt){ spawnAt=t+230; var ang=Math.random()*6.28, sp=w*(0.0015+Math.random()*0.0016);
        sparks.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,gold:Math.random()>0.28,life:1}); }
      sparks.forEach(function(s){ s.x+=s.vx*16; s.y+=s.vy*16; s.life-=0.01; });
      sparks=sparks.filter(function(s){return s.life>0;});
      sparks.forEach(function(s){ ctx.globalAlpha=Math.max(0.35,s.life); ctx.fillStyle=s.gold?"#ffd15a":"#ff3b5c"; ctx.beginPath(); ctx.arc(s.x,s.y,Math.max(6,w*0.02),0,6.28); ctx.fill(); ctx.globalAlpha=1; });
      ctx.fillStyle="#e9f7ff"; ctx.font=Math.max(12,w*0.045)+"px sans-serif";
      ctx.fillText(Math.max(0,Math.ceil((gameUntil-t)/1000))+"с  x"+combo+"  жизни "+lives, 12, 28);
    }
  }
  bursts.forEach(function(p){ p.x+=p.vx; p.y+=p.vy; p.life-=0.04; });
  bursts=bursts.filter(function(p){return p.life>0;});
  bursts.forEach(function(p){ ctx.globalAlpha=p.life; ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,3,3); ctx.globalAlpha=1; });
  floats.forEach(function(f){ f.y-=1.2; f.life-=0.03; });
  floats=floats.filter(function(f){return f.life>0;});
  floats.forEach(function(f){ ctx.globalAlpha=f.life; ctx.fillStyle="#ffd15a"; ctx.font="16px sans-serif"; ctx.fillText(f.t,f.x,f.y); ctx.globalAlpha=1; });
  if (shook) ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(btn){
  btn.onclick=function(){ if(playing) return; tab=btn.getAttribute("data-tab");
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){ b.classList.toggle("on", b===btn); });
    tap(); render(); };
});
render(); refreshMe();
</script>
</body>
