<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synapse</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--c:#5cf2ff;--m:#ff4fd8;--g:#ffd15a;--bg:#05060d;--mut:#8ea3b8;--line:rgba(120,210,255,.16);
 --st:var(--tg-safe-area-inset-top,0px);--sct:var(--tg-content-safe-area-inset-top,0px);--sb:var(--tg-safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#e9f7ff}
body{font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;display:flex;justify-content:center}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}#bg{z-index:0}#fx{z-index:8}
.app{position:relative;z-index:1;width:min(480px,100%);height:100dvh;display:flex;flex-direction:column;padding:calc(10px + max(env(safe-area-inset-top),calc(var(--st) + var(--sct)))) 14px 0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-weight:900;letter-spacing:.14em;font-size:14px}.logo b{color:var(--c);text-shadow:0 0 12px var(--c)}
.pill{position:relative;overflow:hidden;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;border:1px solid rgba(92,242,255,.45);color:var(--c);background:rgba(10,20,34,.6)}
.pill.pr{border-color:var(--m);color:#fff;background:linear-gradient(90deg,rgba(92,242,255,.3),rgba(255,79,216,.45));box-shadow:0 0 16px rgba(255,79,216,.5)}
.shim::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:sh 2.8s ease-in-out infinite}
@keyframes sh{60%,100%{transform:translateX(120%)}}
main{flex:1;position:relative;min-height:0}
.scr{position:absolute;inset:0;overflow:auto;padding-bottom:14px;animation:in .34s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.scr.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateX(28px) scale(.98)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-28px) scale(.98)}to{opacity:1;transform:none}}
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:14px;margin-bottom:10px;
 backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.card.glow{border-color:transparent;background:linear-gradient(rgba(12,14,30,.85),rgba(12,14,30,.85)) padding-box,linear-gradient(135deg,var(--c),var(--m)) border-box;box-shadow:0 0 26px rgba(255,79,216,.22)}
h1{font-size:22px;margin:2px 0 4px}h2{font-size:12px;letter-spacing:.14em;color:var(--c);margin:0 0 8px}h2.m{color:var(--m)}
.mut{color:var(--mut);font-size:13px;margin:0}.c{text-align:center}
.grad{background:linear-gradient(90deg,var(--c),var(--m));-webkit-background-clip:text;background-clip:text;color:transparent}
.prof{display:flex;gap:14px;align-items:center}
.ring{position:relative;flex:none}.ring svg{transform:rotate(-90deg);display:block}.ring circle{fill:none}
.ring .tr{stroke:rgba(255,255,255,.07)}.ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(92,242,255,.7))}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:26px}.ring .in span{font-size:11px;color:var(--mut)}
.chip{display:inline-block;margin:6px 4px 0 0;font-size:12px;padding:3px 9px;border-radius:9px;background:rgba(92,242,255,.1);color:var(--c);border:1px solid rgba(92,242,255,.3);font:inherit;font-size:12px}
.chip.m{color:var(--m);border-color:rgba(255,79,216,.35);background:rgba(255,79,216,.08)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.st{text-align:center;padding:12px 4px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.st b{display:block;font-size:22px}.st span{font-size:11px;color:var(--mut)}
.fire b{color:#ffb347;text-shadow:0 0 10px #ff7a00,0 0 22px #ff4fd8;animation:fl 1.6s ease-in-out infinite}
@keyframes fl{50%{text-shadow:0 0 16px #ff9a00,0 0 34px #ff4fd8}}
.days{display:flex;justify-content:space-between;margin:10px 0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mut)}
.dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.18);font-size:14px}
.dot.on{border:0;background:radial-gradient(circle,#ff9a3c,#ff4fd8);box-shadow:0 0 12px rgba(255,120,60,.7)}
.dot.today{outline:2px solid var(--c);outline-offset:2px}
.btn{position:relative;overflow:hidden;display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:16px;font:inherit;font-weight:800;color:#061018;background:linear-gradient(90deg,var(--c),var(--m));box-shadow:0 0 22px rgba(255,79,216,.3);transition:transform .12s}
.btn.alt{background:rgba(255,255,255,.06);color:#e9f7ff;box-shadow:inset 0 0 0 1px rgba(92,242,255,.35)}
.btn:disabled{opacity:.45}
button:active{transform:scale(.96)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--m));box-shadow:0 0 12px var(--m);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.a{text-align:center;padding:10px 2px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);font-size:10px;color:var(--mut)}
.a i{display:block;font-style:normal;font-size:24px;margin-bottom:3px}
.a.lock i{filter:grayscale(1) brightness(0);opacity:.35}.a.got{border-color:rgba(255,209,90,.5);color:#ffe7a8;box-shadow:0 0 12px rgba(255,209,90,.2)}
.cmp{width:100%;border-collapse:collapse;font-size:13px}.cmp td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.cmp td:nth-child(2){color:var(--mut);text-align:center}.cmp td:nth-child(3){text-align:center;font-weight:800;color:#fff}
.cmp th{font-size:11px;letter-spacing:.1em;padding-bottom:6px}.cmp th:nth-child(2){color:var(--mut)}.cmp th:nth-child(3){color:var(--m)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.plan{position:relative;overflow:hidden;text-align:center;padding:16px 6px 12px;border-radius:18px;font:inherit;color:inherit;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);transition:transform .12s}
.plan.hit{padding-top:22px;border-color:transparent;background:linear-gradient(rgba(30,10,36,.92),rgba(30,10,36,.92)) padding-box,linear-gradient(135deg,var(--c),var(--m)) border-box;box-shadow:0 0 24px rgba(255,79,216,.45);transform:translateY(-4px)}
.plan small{display:block;color:var(--mut);font-size:11px}.plan b{display:block;font-size:22px;color:var(--g);margin:4px 0}
.save{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:7px;background:rgba(92,242,255,.15);color:var(--c)}
.tag{position:absolute;top:0;left:0;right:0;background:linear-gradient(90deg,var(--c),var(--m));color:#140616;font-size:9px;font-weight:900;letter-spacing:.1em;padding:2px 0}
.tlink{display:block;margin:12px auto 0;background:none;border:0;color:var(--c);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.hero{text-align:center;padding:18px 14px}.gem{font-size:46px;filter:drop-shadow(0 0 18px var(--m));animation:fl2 3s ease-in-out infinite}
@keyframes fl2{50%{transform:translateY(-6px) rotate(4deg)}}
.link{font-family:ui-monospace,monospace;font-size:12px;padding:10px;border-radius:12px;background:rgba(0,0,0,.35);border:1px dashed rgba(92,242,255,.35);word-break:break-all;margin-top:8px}
.nudge{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:linear-gradient(90deg,rgba(255,79,216,.15),rgba(92,242,255,.1));border:1px solid rgba(255,79,216,.35);margin-bottom:8px;font-size:13px}
.nudge button{flex:none;border:0;border-radius:10px;padding:7px 10px;font:inherit;font-size:12px;font-weight:800;background:var(--m);color:#1a0614}
.chat{display:flex;flex-direction:column;height:100%}
.log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.bub{max-width:88%;padding:9px 12px;border-radius:16px;white-space:pre-wrap;word-break:break-word;animation:pop .25s;backdrop-filter:blur(10px)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.me{margin-left:auto;background:rgba(40,180,255,.16);border:1px solid rgba(92,242,255,.3)}
.bot{margin-right:auto;background:rgba(255,79,216,.1);border:1px solid rgba(255,79,216,.26)}
.plate{margin:4px 0;padding:8px;border-radius:12px;background:rgba(6,14,24,.85)}.plate b{display:block;font-size:10px;letter-spacing:.14em;color:var(--c)}
.comp{display:flex;gap:8px;margin-top:8px}
textarea{flex:1;resize:none;height:48px;border-radius:14px;border:1px solid rgba(92,242,255,.3);background:rgba(5,8,18,.8);color:#e9f7ff;font:inherit;padding:12px}
.comp button{width:56px;border:0;border-radius:14px;font-size:20px;background:linear-gradient(135deg,var(--c),var(--m))}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon{border:0;background:rgba(255,255,255,.07);color:#e9f7ff;border-radius:10px;padding:6px 10px;font:inherit;font-size:12px}
.stage{height:250px;border-radius:22px;overflow:hidden;background:rgba(6,8,18,.5);border:1px solid var(--line);margin-bottom:10px}
#atom{width:100%;height:100%;display:block;touch-action:none}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 0 calc(8px + max(env(safe-area-inset-bottom),var(--sb)))}
nav button{border:0;border-radius:14px;padding:7px 0;background:transparent;color:var(--mut);font:inherit;font-size:11px;transition:.2s}
nav button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px;filter:grayscale(.6);transition:transform .25s}
nav button.on{color:#fff;background:rgba(16,28,48,.75);box-shadow:inset 0 0 0 1px rgba(92,242,255,.35),0 0 14px rgba(92,242,255,.18)}nav button.on i{filter:drop-shadow(0 0 6px var(--c));transform:translateY(-2px) scale(1.12)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);background:rgba(7,16,24,.92);border:1px solid rgba(92,242,255,.5);border-radius:999px;padding:9px 16px;opacity:0;transition:.22s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:370px){.ring svg{width:100px;height:100px}h1{font-size:20px}.dot{width:26px;height:26px}.plan b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cf2ff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd15a"/><stop offset="1" stop-color="#ff7a3c"/></linearGradient></defs></svg>
<div class="app">
 <header><div class="logo">SYNAPSE<b>//CORE</b></div><div class="pill" id="badge">FREE</div></header>
 <main id="main"></main>
 <nav id="nav">
  <button data-tab="home" class="on"><i>⚡</i>Я</button>
  <button data-tab="chat"><i>💬</i>Чат</button>
  <button data-tab="spark"><i>🔥</i>Искра</button>
  <button data-tab="prem"><i>💎</i>Premium</button>
  <button data-tab="ref"><i>🤝</i>Друзья</button>
 </nav>
</div>
<div class="toast" id="toast"></div>
<script>
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var DAYS={week:7,month:30,year:365,forever:3650};
var LABELS={week:"неделя",month:"месяц",year:"год",forever:"навсегда"};
var ROLES={universal:"Универсал",teacher:"Учитель",coder:"Кодер",writer:"Автор",coach:"Коуч"};
var RANKS=[[0,"✨ Искра"],[3,"🔋 Разряд"],[7,"🌀 Контур"],[15,"⚡ Ядро"],[30,"🌌 Сингулярность"]];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";";});}
function readParam(){var q=new URLSearchParams(location.search).get("d")||"";if(!q)return null;
 q=q.replace(/-/g,"+").replace(/_/g,"/");while(q.length%4)q+="=";var bin=atob(q),by=new Uint8Array(bin.length);
 for(var i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(by));}
var tg=window.Telegram&&window.Telegram.WebApp;var inside=!!(tg&&tg.initData);var OWN=/\/app\/?$/.test(location.pathname);
if(tg){try{tg.ready();tg.expand();}catch(e){}try{if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}catch(e){}
 try{tg.setHeaderColor("#05060d");tg.setBackgroundColor("#05060d");if(tg.setBottomBarColor)tg.setBottomBarColor("#05060d");}catch(e){}}
var live=null;if(inside){try{live=readParam();}catch(e){live=null;}}
var demo={v:1,n:"Нео",p:"trial",pu:0,u:2,l:30,ux:4,s:5,m:"flash",role:"universal",r:2,w:1,nx:["3 дня Premium",1],lk:"https://t.me/core_synapse_bot?start=ref_demo",rk:"✨ Искра",sp:0,b:"core_synapse_bot",
 pr:[["week","Premium на неделю",90],["month","Premium на месяц",250],["year","Premium на год",1500],["forever","Premium на 10 лет",6000]]};
var forged=!inside&&location.search.indexOf("d=")>=0;
var data=live||demo;
var bot=String(data.b||"core_synapse_bot").replace(/[^A-Za-z0-9_]/g,"")||"core_synapse_bot";
var TABS=["home","chat","spark","prem","ref"],tab="home",best=0,thread=[],thinking=false;
try{best=Number(localStorage.getItem("synapse_spark_best")||0)||0;}catch(e){}
try{thread=JSON.parse(localStorage.getItem("synapse_thread")||"[]");if(!Array.isArray(thread))thread=[];thread=thread.slice(-24);}catch(e){thread=[];}
function prem(){return data.p==="premium";}
function lim(){return Number(data.l)||0;}
function leftImp(){return Math.max(0,lim()-(Number(data.u)||0));}
function empty(){return !prem()&&lim()>0&&leftImp()<=0;}
function go(start){var url="https://t.me/"+bot+"?start="+encodeURIComponent(start);if(tg&&tg.openTelegramLink)tg.openTelegramLink(url);else location.href=url;}
function toast(t){var n=document.getElementById("toast");n.textContent=t;n.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(function(){n.classList.remove("on");},1700);}
function tap(k){if(!(tg&&tg.HapticFeedback))return;try{var h=tg.HapticFeedback;
 if(k==="good")h.notificationOccurred("success");else if(k==="bad")h.notificationOccurred("error");else if(k==="sel")h.selectionChanged();else h.impactOccurred("light");}catch(e){}}
function copyText(t,ok){tap("good");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast(ok||"Скопировал");},function(){toast("Не вышло, зажми текст");});else toast("Не вышло, зажми текст");}
function saveThread(){try{localStorage.setItem("synapse_thread",JSON.stringify(thread.slice(-24)));}catch(e){}}
function safeMath(text){var s=String(text||"").trim();if(!/^[0-9+\-*/().\s]+$/.test(s)||s.length>40||!/[0-9]/.test(s))return null;
 try{var n=Function('"use strict";return('+s+")")();if(typeof n!=="number"||!isFinite(n))return null;return Math.round(n*1000)/1000;}catch(e){return null;}}
function until(){var pu=Number(data.pu)||0;if(!pu)return "";if(pu>2e9)return "навсегда";return "до "+new Date(pu*1000).toLocaleDateString("ru-RU",{day:"numeric",month:"long"});}
function mskLeft(){var now=Date.now(),msk=now+3*3600e3,next=(Math.floor(msk/864e5)+1)*864e5;var s=Math.floor((next-msk)/1000);
 function p(n){return (n<10?"0":"")+n;}return p(Math.floor(s/3600))+":"+p(Math.floor(s%3600/60))+":"+p(s%60);}
function rankInfo(){var r=Number(data.r)||0,cur=RANKS[0],nxt=null;for(var i=0;i<RANKS.length;i++){if(r>=RANKS[i][0])cur=RANKS[i];else{nxt=RANKS[i];break;}}
 return{r:r,cur:cur,nxt:nxt,frac:nxt?(r-cur[0])/(nxt[0]-cur[0]):1};}
function ring(id,size,sw,frac,grad,inner){var R=(size-sw)/2-2,C=2*Math.PI*R;
 return "<div class='ring'><svg width='"+size+"' height='"+size+"' viewBox='0 0 "+size+" "+size+"'><circle class='tr' cx='"+size/2+"' cy='"+size/2+"' r='"+R+"' stroke-width='"+sw+"'/><circle class='fg' data-ring='1' cx='"+size/2+"' cy='"+size/2+"' r='"+R+"' stroke-width='"+sw+"' stroke='url(#"+grad+")' stroke-dasharray='"+C+"' stroke-dashoffset='"+C+"' data-to='"+(C*(1-Math.max(0,Math.min(1,frac))))+"'/></svg><div class='in'>"+inner+"</div></div>";}
function N(v){return "<span data-n='"+v+"'>"+(RM?v:0)+"</span>";}
function streakDays(){var s=Number(data.s)||0,wd=["вс","пн","вт","ср","чт","пт","сб"],today=new Date(Date.now()+3*3600e3).getUTCDay(),h="<div class='days'>";
 for(var i=6;i>=0;i--){var on=i<Math.min(s,7);h+="<div class='day'><div class='dot"+(on?" on":"")+(i===0?" today":"")+"'>"+(on?"🔥":"")+"</div>"+wd[(today-i+7)%7]+"</div>";}return h+"</div>";}
function achList(){var s=Number(data.s)||0,r=Number(data.r)||0;return[["🔥","3 дня",s>=3],["🔥","Неделя",s>=7],["☄️","30 дней",s>=30],["✨","Искра дня",!!Number(data.sp)],
 ["🤝","1 друг",r>=1],["🔋","Разряд",r>=3],["🚀","Ultra",data.m==="ultra"||prem()],["💎","Premium",prem()]];}
function vHome(){
 var l=lim(),left=leftImp(),pr=prem(),s=Number(data.s)||0,ri=rankInfo(),goal=Math.max(1,Math.min(3,l||3)),done=Math.min(goal,Number(data.u)||0);
 var h="";if(empty())h+="<div class='nudge'><span>⚡ Импульсы на сегодня всё. Новые через <b class='cd'>"+mskLeft()+"</b></span><button data-go='prem'>💎 Без лимита</button></div>";
 h+="<div class='card glow'><div class='prof'>"+ring("rg",118,10,pr?1:(l?left/l:0),"gr",pr?"<b>∞</b><span>безлимит</span>":"<b>"+N(left)+"</b><span>из "+l+" ⚡</span>")+
 "<div><p class='mut'>Привет,</p><h1>"+esc(data.n||"ты")+"</h1><button class='chip' id='rank'>"+esc(data.rk||ri.cur[1])+"</button><span class='chip m'>🧩 "+esc(ROLES[data.role]||data.role||"Универсал")+"</span></div></div>"+
 (pr?"":"<p class='mut c' style='margin-top:8px'>Пополнение через <b class='cd'>"+mskLeft()+"</b> (00:00 МСК)</p>")+"</div>";
 h+="<div class='stats'><div class='st fire'><b>🔥"+N(s)+"</b><span>"+(s?"дней подряд":"начни серию")+"</span></div>"+
 "<div class='st'><b>"+(data.m==="ultra"?"🚀":"⚡")+"</b><span>"+(data.m==="ultra"?"Ultra":"Flash")+"</span></div>"+
